<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">Updated VQC and baseline performance plots</title>
  <desc id="desc">Four bar charts showing fixed VQC test metrics, same-subset F1, same-subset ROC-AUC, and full-dataset classical F1 versus ROC-AUC.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1; }
      .title { font: 700 28px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 15px Arial, sans-serif; fill: #4b5563; }
      .panel-title { font: 700 18px Arial, sans-serif; fill: #111827; }
      .axis { stroke: #6b7280; stroke-width: 1.4; }
      .grid { stroke: #e5e7eb; stroke-width: 1; }
      .label { font: 400 12px Arial, sans-serif; fill: #374151; }
      .tiny { font: 400 11px Arial, sans-serif; fill: #4b5563; }
      .value { font: 700 11px Arial, sans-serif; fill: #111827; }
      .vqc { fill: #4f46e5; }
      .classical { fill: #0ea5e9; }
      .auc { fill: #10b981; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="860"/>
  <text class="title" x="60" y="45">Updated VQC Performance Plots</text>
  <text class="subtitle" x="60" y="70">Generated from the current notebook results: fixed single-qubit readout, quantile scaling, and checkpointed SPSA training.</text>

  <!-- Panel A: VQC metric profile -->
  <g transform="translate(40,90)">
    <rect class="panel" width="540" height="330" rx="12"/>
    <text class="panel-title" x="24" y="34">Fixed VQC Test Metrics</text>
    <text class="tiny" x="24" y="55">Held-out quantum test subset, n = 160</text>
    <line class="grid" x1="60" y1="70" x2="480" y2="70"/>
    <line class="grid" x1="60" y1="160" x2="480" y2="160"/>
    <line class="grid" x1="60" y1="250" x2="480" y2="250"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="250"/>
    <line class="axis" x1="60" y1="250" x2="480" y2="250"/>
    <text class="tiny" x="20" y="74">1.00</text>
    <text class="tiny" x="20" y="164">0.875</text>
    <text class="tiny" x="20" y="254">0.75</text>
    <rect class="vqc" x="75" y="151" width="32" height="99" rx="4"/>
    <rect class="vqc" x="130" y="151" width="32" height="99" rx="4"/>
    <rect class="vqc" x="185" y="120" width="32" height="130" rx="4"/>
    <rect class="vqc" x="240" y="187" width="32" height="63" rx="4"/>
    <rect class="vqc" x="295" y="155" width="32" height="95" rx="4"/>
    <rect class="vqc" x="350" y="108" width="32" height="142" rx="4"/>
    <rect class="vqc" x="405" y="229" width="32" height="21" rx="4"/>
    <text class="value" x="91" y="144" text-anchor="middle">0.8875</text>
    <text class="value" x="146" y="144" text-anchor="middle">0.8875</text>
    <text class="value" x="201" y="113" text-anchor="middle">0.9306</text>
    <text class="value" x="256" y="180" text-anchor="middle">0.8375</text>
    <text class="value" x="311" y="148" text-anchor="middle">0.8816</text>
    <text class="value" x="366" y="101" text-anchor="middle">0.9470</text>
    <text class="value" x="421" y="222" text-anchor="middle">0.7789</text>
    <text class="label" x="91" y="276" text-anchor="middle">Acc</text>
    <text class="label" x="146" y="276" text-anchor="middle">Bal</text>
    <text class="label" x="201" y="276" text-anchor="middle">Prec</text>
    <text class="label" x="256" y="276" text-anchor="middle">Rec</text>
    <text class="label" x="311" y="276" text-anchor="middle">F1</text>
    <text class="label" x="366" y="276" text-anchor="middle">AUC</text>
    <text class="label" x="421" y="276" text-anchor="middle">MCC</text>
  </g>

  <!-- Panel B: same-subset F1 -->
  <g transform="translate(620,90)">
    <rect class="panel" width="540" height="330" rx="12"/>
    <text class="panel-title" x="24" y="34">F1 on Same 160-Sample Test Subset</text>
    <text class="tiny" x="24" y="55">VQC compared with classical baselines on the same held-out samples</text>
    <line class="grid" x1="60" y1="70" x2="480" y2="70"/>
    <line class="grid" x1="60" y1="160" x2="480" y2="160"/>
    <line class="grid" x1="60" y1="250" x2="480" y2="250"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="250"/>
    <line class="axis" x1="60" y1="250" x2="480" y2="250"/>
    <text class="tiny" x="22" y="74">0.95</text>
    <text class="tiny" x="22" y="164">0.90</text>
    <text class="tiny" x="22" y="254">0.85</text>
    <rect class="vqc" x="80" y="193" width="38" height="57" rx="4"/>
    <rect class="classical" x="145" y="98" width="38" height="152" rx="4"/>
    <rect class="classical" x="210" y="133" width="38" height="117" rx="4"/>
    <rect class="classical" x="275" y="150" width="38" height="100" rx="4"/>
    <rect class="classical" x="340" y="120" width="38" height="130" rx="4"/>
    <rect class="classical" x="405" y="148" width="38" height="102" rx="4"/>
    <text class="value" x="99" y="186" text-anchor="middle">0.8816</text>
    <text class="value" x="164" y="91" text-anchor="middle">0.9342</text>
    <text class="value" x="229" y="126" text-anchor="middle">0.9150</text>
    <text class="value" x="294" y="143" text-anchor="middle">0.9057</text>
    <text class="value" x="359" y="113" text-anchor="middle">0.9221</text>
    <text class="value" x="424" y="141" text-anchor="middle">0.9067</text>
    <text class="label" x="99" y="276" text-anchor="middle">VQC</text>
    <text class="label" x="164" y="276" text-anchor="middle">SVM</text>
    <text class="label" x="229" y="276" text-anchor="middle">RF</text>
    <text class="label" x="294" y="276" text-anchor="middle">GB</text>
    <text class="label" x="359" y="276" text-anchor="middle">LR</text>
    <text class="label" x="424" y="276" text-anchor="middle">KNN</text>
  </g>

  <!-- Panel C: same-subset ROC-AUC -->
  <g transform="translate(40,470)">
    <rect class="panel" width="540" height="330" rx="12"/>
    <text class="panel-title" x="24" y="34">ROC-AUC on Same 160-Sample Test Subset</text>
    <text class="tiny" x="24" y="55">Ranking quality after the VQC readout and scaling fixes</text>
    <line class="grid" x1="60" y1="70" x2="480" y2="70"/>
    <line class="grid" x1="60" y1="160" x2="480" y2="160"/>
    <line class="grid" x1="60" y1="250" x2="480" y2="250"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="250"/>
    <line class="axis" x1="60" y1="250" x2="480" y2="250"/>
    <text class="tiny" x="22" y="74">0.98</text>
    <text class="tiny" x="22" y="164">0.96</text>
    <text class="tiny" x="22" y="254">0.94</text>
    <rect class="vqc" x="80" y="219" width="38" height="31" rx="4"/>
    <rect class="classical" x="145" y="89" width="38" height="161" rx="4"/>
    <rect class="classical" x="210" y="102" width="38" height="148" rx="4"/>
    <rect class="classical" x="275" y="76" width="38" height="174" rx="4"/>
    <rect class="classical" x="340" y="102" width="38" height="148" rx="4"/>
    <rect class="classical" x="405" y="160" width="38" height="90" rx="4"/>
    <text class="value" x="99" y="212" text-anchor="middle">0.9470</text>
    <text class="value" x="164" y="82" text-anchor="middle">0.9758</text>
    <text class="value" x="229" y="95" text-anchor="middle">0.9729</text>
    <text class="value" x="294" y="69" text-anchor="middle">0.9786</text>
    <text class="value" x="359" y="95" text-anchor="middle">0.9730</text>
    <text class="value" x="424" y="153" text-anchor="middle">0.9600</text>
    <text class="label" x="99" y="276" text-anchor="middle">VQC</text>
    <text class="label" x="164" y="276" text-anchor="middle">SVM</text>
    <text class="label" x="229" y="276" text-anchor="middle">RF</text>
    <text class="label" x="294" y="276" text-anchor="middle">GB</text>
    <text class="label" x="359" y="276" text-anchor="middle">LR</text>
    <text class="label" x="424" y="276" text-anchor="middle">KNN</text>
  </g>

  <!-- Panel D: full-dataset classical comparison -->
  <g transform="translate(620,470)">
    <rect class="panel" width="540" height="330" rx="12"/>
    <text class="panel-title" x="24" y="34">Full Balanced Dataset Classical Baselines</text>
    <text class="tiny" x="24" y="55">F1 and ROC-AUC using the full balanced classical evaluation set</text>
    <line class="grid" x1="60" y1="70" x2="480" y2="70"/>
    <line class="grid" x1="60" y1="160" x2="480" y2="160"/>
    <line class="grid" x1="60" y1="250" x2="480" y2="250"/>
    <line class="axis" x1="60" y1="70" x2="60" y2="250"/>
    <line class="axis" x1="60" y1="250" x2="480" y2="250"/>
    <text class="tiny" x="22" y="74">0.98</text>
    <text class="tiny" x="22" y="164">0.94</text>
    <text class="tiny" x="22" y="254">0.90</text>
    <rect class="classical" x="85" y="174" width="14" height="76" rx="3"/>
    <rect class="auc" x="103" y="111" width="14" height="139" rx="3"/>
    <rect class="classical" x="158" y="178" width="14" height="72" rx="3"/>
    <rect class="auc" x="176" y="96" width="14" height="154" rx="3"/>
    <rect class="classical" x="231" y="187" width="14" height="63" rx="3"/>
    <rect class="auc" x="249" y="86" width="14" height="164" rx="3"/>
    <rect class="classical" x="304" y="167" width="14" height="83" rx="3"/>
    <rect class="auc" x="322" y="90" width="14" height="160" rx="3"/>
    <rect class="classical" x="377" y="175" width="14" height="75" rx="3"/>
    <rect class="auc" x="395" y="119" width="14" height="131" rx="3"/>
    <text class="label" x="101" y="276" text-anchor="middle">SVM</text>
    <text class="label" x="174" y="276" text-anchor="middle">RF</text>
    <text class="label" x="247" y="276" text-anchor="middle">GB</text>
    <text class="label" x="320" y="276" text-anchor="middle">LR</text>
    <text class="label" x="393" y="276" text-anchor="middle">KNN</text>
    <rect class="classical" x="340" y="28" width="12" height="12" rx="2"/>
    <text class="tiny" x="358" y="39">F1</text>
    <rect class="auc" x="392" y="28" width="12" height="12" rx="2"/>
    <text class="tiny" x="410" y="39">ROC-AUC</text>
  </g>
</svg>
